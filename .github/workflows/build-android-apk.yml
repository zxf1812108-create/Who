name: 编译打包 Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型 (release 正式版 / debug 调试版)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read
  actions: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 配置 Java 21 (Capacitor 8)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 准备预装 Android SDK 许可
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: 安装前端依赖
        run: npm install --legacy-peer-deps

      - name: 确保人脸识别模型文件就绪
        run: node scripts/prepare-android.mjs models

      - name: 构建 Web 应用资源
        run: npm run build

      - name: 生成并同步 Capacitor Android 工程
        env:
          CI: 'true'
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 缓存 InsightFace 旗舰识别模型 (SCRFD + ArcFace R50)
        id: cache-insightface
        uses: actions/cache@v4
        with:
          path: .insightface-cache
          key: insightface-buffalo-l-r50-v1

      - name: 下载并内置 InsightFace 旗舰 ONNX 模型
        run: |
          mkdir -p .insightface-cache android/app/src/main/assets/insightface
          if [ ! -s ".insightface-cache/det_10g.onnx" ] || [ ! -s ".insightface-cache/w600k_r50.onnx" ]; then
            echo "Downloading InsightFace buffalo_l model pack..."
            curl -fL --retry 3 --retry-delay 5 \
              -o /tmp/buffalo_l.zip \
              "https://github.com/deepinsight/insightface/releases/download/v0.7/buffalo_l.zip"
            unzip -o -j /tmp/buffalo_l.zip "*det_10g.onnx" "*w600k_r50.onnx" -d .insightface-cache
            rm -f /tmp/buffalo_l.zip
          fi
          cp .insightface-cache/det_10g.onnx android/app/src/main/assets/insightface/det_10g.onnx
          cp .insightface-cache/w600k_r50.onnx android/app/src/main/assets/insightface/w600k_r50.onnx
          ls -lh android/app/src/main/assets/insightface/
          test -s android/app/src/main/assets/insightface/det_10g.onnx
          test -s android/app/src/main/assets/insightface/w600k_r50.onnx

      - name: 计算版本号并注入权限与原生插件
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          CURRENT_YEAR=$(TZ=Asia/Shanghai date +%Y)
          MAJOR=$((CURRENT_YEAR - 2025))
          if [ "$MAJOR" -lt 1 ]; then MAJOR=1; fi

          PREV_YEAR=$((CURRENT_YEAR - 1))
          YEAR_START_UTC="${PREV_YEAR}-12-31T16:00:00Z"

          API_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-android-apk.yml/runs"
          YEAR_RUNS=$(curl -fsSL --get \
            --data-urlencode "created=>=${YEAR_START_UTC}" \
            --data-urlencode "per_page=1" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "$API_URL" | node -e "const d = JSON.parse(require('fs').readFileSync(0,'utf8')); console.log(Number(d.total_count) || 0);" 2>/dev/null || echo "0")

          if [ "$YEAR_RUNS" -gt 0 ] 2>/dev/null; then
            MINOR="$YEAR_RUNS"
          else
            MINOR="${GITHUB_RUN_NUMBER:-1}"
          fi

          VERSION_NAME="${MAJOR}.${MINOR}"
          VERSION_CODE=$((MAJOR * 100000 + MINOR))

          echo "ANDROID_VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_MINOR=${MINOR}" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "Computed Android version: v${VERSION_NAME} (versionCode=${VERSION_CODE})"

          ANDROID_VERSION_NAME="$VERSION_NAME" \
          ANDROID_VERSION_MINOR="$MINOR" \
          ANDROID_VERSION_CODE="$VERSION_CODE" \
          node scripts/prepare-android.mjs manifest

      - name: 编译并签名 Android APK
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'release' }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p release
          chmod +x android/gradlew

          if [ "$BUILD_TYPE" = "debug" ]; then
            (cd android && ./gradlew assembleDebug --no-daemon)
            OUT_APK="release/renlian-v${ANDROID_VERSION_NAME}-debug.apk"
            cp android/app/build/outputs/apk/debug/app-debug.apk "$OUT_APK"
            echo "APK_PATH=${OUT_APK}" >> "$GITHUB_ENV"
            echo "ARTIFACT_NAME=renlian-v${ANDROID_VERSION_NAME}-debug-apk" >> "$GITHUB_ENV"
          else
            (cd android && ./gradlew assembleRelease --no-daemon)

            UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
            if [ ! -f "$UNSIGNED_APK" ]; then
              UNSIGNED_APK="android/app/build/outputs/apk/release/app-release.apk"
            fi

            BUILD_TOOLS_DIR="$(ls -d "$ANDROID_HOME/build-tools"/* | sort -V | tail -n 1)"
            echo "Using Android build-tools: $BUILD_TOOLS_DIR"

            "$BUILD_TOOLS_DIR/zipalign" -f -p 4 "$UNSIGNED_APK" /tmp/renlian-aligned.apk

            KEYSTORE_FILE="/tmp/release-signing.jks"
            if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
              echo "Using configured GitHub Secrets release keystore."
              printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
              STORE_PASS="$KEYSTORE_PASSWORD"
              ALIAS_NAME="$KEY_ALIAS"
              ALIAS_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            else
              echo "No custom keystore secrets detected; generating temporary signing key for installable Release APK."
              STORE_PASS="$(openssl rand -hex 16)"
              ALIAS_PASS="$STORE_PASS"
              ALIAS_NAME="renlian"
              keytool -genkeypair -v \
                -keystore "$KEYSTORE_FILE" \
                -alias "$ALIAS_NAME" \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass "$STORE_PASS" \
                -keypass "$ALIAS_PASS" \
                -dname "CN=RenLian, OU=Mobile, O=RenLian, L=Shanghai, S=Shanghai, C=CN"
            fi

            OUT_APK="release/renlian-v${ANDROID_VERSION_NAME}-release.apk"
            "$BUILD_TOOLS_DIR/apksigner" sign \
              --ks "$KEYSTORE_FILE" \
              --ks-key-alias "$ALIAS_NAME" \
              --ks-pass "pass:$STORE_PASS" \
              --key-pass "pass:$ALIAS_PASS" \
              --out "$OUT_APK" \
              /tmp/renlian-aligned.apk

            "$BUILD_TOOLS_DIR/apksigner" verify "$OUT_APK"
            rm -f "$KEYSTORE_FILE" /tmp/renlian-aligned.apk

            echo "APK_PATH=${OUT_APK}" >> "$GITHUB_ENV"
            echo "ARTIFACT_NAME=renlian-v${ANDROID_VERSION_NAME}-release-apk" >> "$GITHUB_ENV"
          fi

          ls -lh release/

      - name: 上传 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30

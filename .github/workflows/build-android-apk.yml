name: 编译打包 Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 配置 Java 21 (Capacitor 8)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 准备预装 Android SDK 许可
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: 安装前端依赖
        run: npm install

      - name: 确保人脸识别模型文件就绪
        run: node scripts/prepare-android.mjs models

      - name: 构建 Web 应用资源
        run: npm run build

      - name: 生成并同步 Capacitor Android 工程
        env:
          CI: 'true'
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 注入相机与相册权限到 AndroidManifest.xml
        run: node scripts/prepare-android.mjs manifest

      - name: 编译生成 Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 整理输出 APK 文件
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/mianpushiren-debug.apk
          ls -lh release/mianpushiren-debug.apk

      - name: 上传 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: mianpushiren-android-apk
          path: release/mianpushiren-debug.apk
          if-no-files-found: error
          retention-days: 30

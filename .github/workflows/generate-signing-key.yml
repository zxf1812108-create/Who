name: 生成固定签名密钥（仅需运行一次）

on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: '请设置一个 6 位以上的证书密码（请牢记，稍后需填入 Secrets）'
        required: true
        type: string
      key_alias:
        description: '密钥别名（保持默认即可）'
        required: true
        default: 'mianpushiren'
        type: string

permissions:
  contents: read

jobs:
  generate-key:
    name: Generate Android Release Keystore
    runs-on: ubuntu-latest

    steps:
      - name: 配置 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 生成固定签名证书并转为 Base64
        env:
          KEYSTORE_PASSWORD: ${{ inputs.keystore_password }}
          KEY_ALIAS: ${{ inputs.key_alias }}
        run: |
          if [ "${#KEYSTORE_PASSWORD}" -lt 6 ]; then
            echo "错误：密码长度至少需要 6 位字符"
            exit 1
          fi

          mkdir -p key-output
          keytool -genkeypair \
            -keystore key-output/release.jks \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=MianPuShiRen, OU=Mobile, O=Personal, L=Shanghai, S=Shanghai, C=CN"

          base64 -w 0 key-output/release.jks > key-output/keystore_base64.txt

          cat <<EOF > key-output/配置说明.txt
          请在 GitHub 仓库的 Settings -> Secrets and variables -> Actions 中新增以下 4 个 Secret：

          1. ANDROID_KEYSTORE_BASE64  -> 粘贴 keystore_base64.txt 中的全部内容（不要多空格或换行）
          2. ANDROID_KEYSTORE_PASSWORD -> 填您刚才输入的密码
          3. ANDROID_KEY_ALIAS         -> 填 $KEY_ALIAS
          4. ANDROID_KEY_PASSWORD      -> 填您刚才输入的密码

          重要提醒：复制保存后，请回到本次 Actions 运行页面删除此下载包，以免泄露签名密钥。
          EOF

      - name: 上传密钥文件（1 天后自动过期，请用完即删）
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-key-delete-after-use
          path: |
            key-output/keystore_base64.txt
            key-output/release.jks
            key-output/配置说明.txt
          retention-days: 1
